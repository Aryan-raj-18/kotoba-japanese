name: Play Store release AAB

# Produces a signed upload bundle; publishing to Play Console is intentionally
# manual so listing, declarations and staged rollout can be reviewed first.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-trigger/build75.txt'

permissions:
  contents: read

jobs:
  verify-and-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/kotoba-dom --no-audit --no-fund --ignore-scripts jsdom@26.1.0
      - name: Synchronize Android source package
        run: python sync_android.py
      - name: Run all release regression suites
        env:
          NODE_PATH: /tmp/kotoba-dom/node_modules
          JSDOM_MODULE: /tmp/kotoba-dom/node_modules/jsdom
        run: |
          python run_release_checks.py
          python -m unittest discover -q
          python smoke_test_android.py
          python test_release_layout.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed Play release and run lint
        working-directory: android
        env:
          KOTOBA_BUILD_PYTHON: python
          KOTOBA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.KOTOBA_UPLOAD_KEYSTORE_BASE64 }}
          KOTOBA_UPLOAD_STORE_PASSWORD: ${{ secrets.KOTOBA_UPLOAD_STORE_PASSWORD }}
          KOTOBA_UPLOAD_KEY_ALIAS: ${{ secrets.KOTOBA_UPLOAD_KEY_ALIAS }}
          KOTOBA_UPLOAD_KEY_PASSWORD: ${{ secrets.KOTOBA_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f upload-key.jks upload-signing.properties' EXIT
          python - <<'PY'
          import base64,os,pathlib
          names=['KOTOBA_UPLOAD_KEYSTORE_BASE64','KOTOBA_UPLOAD_STORE_PASSWORD',
                 'KOTOBA_UPLOAD_KEY_ALIAS','KOTOBA_UPLOAD_KEY_PASSWORD']
          missing=[key for key in names if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing signing secrets: '+', '.join(missing))
          pathlib.Path('upload-key.jks').write_bytes(base64.b64decode(
              os.environ['KOTOBA_UPLOAD_KEYSTORE_BASE64'],validate=True))
          if pathlib.Path('upload-key.jks').stat().st_size < 100:
              raise SystemExit('Upload keystore secret is not a valid keystore file')
          def escape(s):
              return s.replace('\\','\\\\').replace('\n','\\n').replace('=','\\=').replace(':','\\:')
          pathlib.Path('upload-signing.properties').write_text('\n'.join((
              'storeFile=upload-key.jks',
              'storePassword='+escape(os.environ['KOTOBA_UPLOAD_STORE_PASSWORD']),
              'keyAlias='+escape(os.environ['KOTOBA_UPLOAD_KEY_ALIAS']),
              'keyPassword='+escape(os.environ['KOTOBA_UPLOAD_KEY_PASSWORD']),
              '')))
          PY
          gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          unzip -tq app/build/outputs/bundle/release/app-release.aab
          python ../verify_play_bundle.py app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-build75-signed-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload release verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-build75-release-checks
          path: |
            verification/regression-results.json
            verification/play-aab-verification.json
            verification/*.log
            verification/browser-layout/**
          if-no-files-found: ignore
          retention-days: 14

/* =====================================================================
   Kotoba Immersive UI Shell
   ---------------------------------------------------------------------
   Non-invasive visual wrapper. It deliberately does not redefine routes,
   data, forms, page scripts, IDs, or learning logic. Existing components
   remain the source of truth; this file only changes presentation.

   IMPORTANT: this shell no longer ships its own fixed color palette.
   Earlier it redefined --paper/--card-bg/--ink/etc. under
   [data-ui-shell="immersive"] to one hardcoded dark scheme, which sat at
   the same CSS specificity as the theme picker's [data-theme="…"] rules
   in style.css and loaded after them — so it silently won every time,
   and switching themes in the settings panel had no visible effect.
   Instead, every "glass" surface below reads the *current* theme's own
   tokens (--paper, --card-bg, --ink, --indigo, --seal, --line, …) and
   only adds translucency + blur on top of them with color-mix(). Pick
   Sumi and the glass goes dark; pick Sakura and it goes a soft pink —
   the shell is a finish, not a competing theme.

   Each color-mix() line is preceded by a plain fallback using the same
   variable name. Browsers without color-mix() support simply keep the
   opaque fallback (a custom property with an unparsable value is
   dropped, not blank), so the UI stays fully readable either way.
   ===================================================================== */

html[data-ui-shell="immersive"] {
  --shell-radius: 22px;

  /* Card / panel surfaces. ~92% of the theme's own card color, so the
     glass reads as "the theme, lightly frosted" rather than "see-through". */
  --shell-surface: var(--card-bg);
  --shell-surface: color-mix(in srgb, var(--card-bg) 92%, transparent);
  --shell-surface-strong: var(--card-bg);
  --shell-surface-strong: color-mix(in srgb, var(--card-bg) 96%, transparent);

  /* Floating header / bottom nav — slightly lighter than cards so they
     still read as a distinct layer floating over content. */
  --shell-header-bg: var(--paper);
  --shell-header-bg: color-mix(in srgb, var(--paper) 90%, transparent);

  --shell-border: var(--line);
  --shell-border: color-mix(in srgb, var(--ink) 14%, var(--line));

  --shell-input-bg: var(--surface);
  --shell-input-bg: color-mix(in srgb, var(--surface) 90%, transparent);

  --shell-active-bg: var(--indigo);
}

html[data-ui-shell="immersive"],
html[data-ui-shell="immersive"] body {
  min-height: 100%;
}

/* Ambient body wash, built from the active theme's own wash colors
   (already tuned per-theme in style.css) rather than a fixed dark
   gradient, so it shifts with the theme too. */
html[data-ui-shell="immersive"] body {
  background:
    radial-gradient(ellipse at 12% 8%, var(--bg-wash-1), transparent 40%),
    radial-gradient(ellipse at 88% 16%, var(--bg-wash-2), transparent 42%),
    radial-gradient(ellipse at 50% 105%, var(--bg-wash-1), transparent 46%),
    var(--paper);
  background-attachment: fixed;
}

/* Build 61 — first-paint background continuity across ordinary links,
   back/forward navigation, and Android WebView document reloads.
   This fallback is rendered by CSS at the first body paint, *before*
   async IndexedDB can deliver the full wallpaper or animated GIF. */
html[data-ui-shell="immersive"][data-wallpaper-preview="ready"] body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: var(--paper);
  background-image:
    linear-gradient(color-mix(in srgb, var(--paper) var(--wallpaper-boot-dim,60%), transparent),
                    color-mix(in srgb, var(--paper) var(--wallpaper-boot-dim,60%), transparent)),
    var(--wallpaper-boot-image);
  background-position: center, var(--wallpaper-boot-position, center);
  background-size: cover, var(--wallpaper-boot-size, cover);
  background-repeat: no-repeat;
}
/* On supporting Chromium/Android WebView versions, hold the old page
   snapshot until the newly loaded page has its already-painted backdrop. */
@view-transition { navigation: auto; }
@keyframes kotoba-page-arrive { from { opacity: 0; } to { opacity: 1; } }
::view-transition-old(root) { animation: none; }
::view-transition-new(root) { animation: 140ms ease-out both kotoba-page-arrive; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}

/* =====================================================================
   USER WALLPAPER
   ---------------------------------------------------------------------
   Presentation-only: the chosen image/GIF is stored as a Blob in
   IndexedDB on this device (ui-shell.js) and painted here as a fixed
   layer behind the app. A theme-colored scrim sits on top of it at an
   adjustable strength (the "Dim" slider) so body text and kana/kanji
   stay legible over any photo — the scrim uses --paper, so it darkens
   for dark themes and stays light for light themes instead of always
   flattening everything to black.
   ================================================================== */
.kotoba-wallpaper {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  background-color: var(--paper);
}
.kotoba-wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--paper);
  opacity: var(--wallpaper-scrim, 0.6);
}
html[data-ui-shell="immersive"] body.has-kotoba-wallpaper {
  background: var(--paper);
}
html[data-ui-shell="immersive"] .seal-bg { z-index: 1; }

   pattern token instead of a fixed white, so it stays visible without
   ever looking like a mistake on a light theme. */

  opacity: 0.65;

 box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 42%, transparent), inset 0 1px 0 var(--liquid-shine) !important;
 font-weight: 700;
}
/* Native Android WebView paints an opaque blue touch-highlight unless we
   suppress it. App feedback and focus-visible outlines remain available. */
html[data-ui-shell="immersive"] :is(a,button,[role="button"],input,select,textarea) {

}
@media (hover: none) and (pointer: coarse) {

 html[data-ui-shell="immersive"] :is(.kotoba-bottom-nav a,.site-header a,.game-pick,.rm-stage-nav a) {transition-duration: 0s !important;}
}

/* Build 57 audit: an opened word is a reading surface, not a transparent
   viewport onto other words. Retain translucency in both modes but give
   the dialog substantially more contrast than the surrounding catalogue. */
@supports (background: color-mix(in srgb, white 50%, transparent)) {
 html[data-ui-shell="immersive"][data-glass="on"] #word-modal-card.word-detail-modal,
 html[data-ui-shell="immersive"][data-glass="on"] :is(.voice-search-dialog,.practice-exit-dialog) {

 }
}
/* The modal owns its scrolling; the background may not scroll or intercept
   touches. Restrict the word sheet's height and reserve safe-area space. */
html[data-ui-shell="immersive"] #word-modal.is-open { overflow-y:auto; overscroll-behavior:contain; }
html[data-ui-shell="immersive"] #word-modal-card.word-detail-modal {

 -webkit-overflow-scrolling:touch;
}

 background-color:var(--liquid-panel-strong) !important;
 border-color:var(--liquid-trim);
}
/* The game board is a layout wrapper. Restore a real glass pane behind
   questions/results, preventing Japanese glyphs from getting lost on artwork. */
html[data-ui-shell="immersive"] #game-board > :is(.game-question,.game-finish) {
 background-color:var(--liquid-panel) !important;
 background-image:var(--liquid-reflection) !important;
 border:1px solid var(--liquid-trim);
 border-radius:22px;
 padding:clamp(14px,3vw,28px);
 box-shadow:var(--liquid-shadow);
 -webkit-backdrop-filter:var(--liquid-blur) !important;
 backdrop-filter:var(--liquid-blur) !important;
}
html[data-ui-shell="immersive"] :is(.game-question,.game-finish) > * {min-width:0;overflow-wrap:anywhere;}
@media (max-width:700px) {
 /* The fixed five-tab navigation must not cover the legal/footer controls
    at the end of a long page. Safe areas also apply to installed WebViews. */
 html[data-ui-shell="immersive"] .site-footer {
  padding-bottom:calc(112px + env(safe-area-inset-bottom, 0px));
 }
 html[data-ui-shell="immersive"] .game-stage {padding:10px 0 18px;}
 html[data-ui-shell="immersive"] :is(.game-big,.speaking-jp,.quiz-sentence,.modal-word) {

 }
 html[data-ui-shell="immersive"] #word-modal-card.word-detail-modal {
  max-height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 24px);
 }
}
/* Avoid a blank/ghost word sheet during the first composited frame on
   touch devices. Desktop keeps the existing short entry animation. */
@media (hover:none) and (pointer:coarse) {
 html[data-ui-shell="immersive"] #word-modal-card.word-detail-modal {animation:none !important;}
}
/* Fixed lesson dialogs must be able to stack above the sticky header. */
html[data-ui-shell="immersive"] body.word-modal-open .site-main {z-index:950;}

 html[data-ui-shell="immersive"] body:has(.site-main .modal-overlay:not([hidden])) .site-main {z-index:950;}
}

/* Build 63 — detail popups (Hiragana/Katakana, Kanji, Verbs, Everyday) */
body.kotoba-sheet-open .kotoba-bottom-nav { display: none !important; }
html[data-ui-shell="immersive"] .modal-card .modal-close {
  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  min-width: 40px;
  padding: 0 !important;
  display: grid;
  place-items: center;
  border: 1px solid var(--liquid-trim) !important;
  border-radius: 50% !important;
  background-color: var(--liquid-panel-strong) !important;
  background-image: none !important;
  box-shadow: inset 0 1px 0 var(--liquid-shine) !important;
  color: var(--ink) !important;
  line-height: 1;
}


/* =====================================================================
   Build 64 — detail pages: one consistent inner spacing system
   (kanji, radical, story, conversation, vocabulary, sentence cards).
   Bullets stay INSIDE their box; text never touches a rounded rim.
   ===================================================================== */
html[data-ui-shell="immersive"] :is(
  .rad-section, .vocab-section, .sentence-section, .rad-panel
) {
  padding: clamp(16px, 2.4vw, 24px);
}
html[data-ui-shell="immersive"] :is(.rad-section, .vocab-section, .sentence-section) > h2 {
  margin: 0 0 14px;
  line-height: 1.3;
}

/* "How to read": bullets sit inside the box with room for the marker. */
html[data-ui-shell="immersive"] .rad-read-list {
  list-style: disc outside;
  margin: 0;
  padding: 16px 20px 16px 40px !important;
  line-height: 1.7;
}
html[data-ui-shell="immersive"] .rad-read-list > li { padding-left: 2px; overflow-wrap: anywhere; }
html[data-ui-shell="immersive"] .rad-read-list > li + li { margin-top: 14px; }
html[data-ui-shell="immersive"] .rad-read-list > li::marker { color: var(--gold); }
html[data-ui-shell="immersive"] .rad-read-ex {
  display: block;
  margin: 5px 0 0;
  padding-left: 2px;
  line-height: 1.6;
}

/* Radical explanation blocks: breathing room inside and between boxes. */
html[data-ui-shell="immersive"] :is(.rad-origin, .rad-tip, .rad-build) {
  padding: 14px 18px;
  margin: 14px 0 0;
  line-height: 1.65;
}
html[data-ui-shell="immersive"] .rad-build p { margin: 0 0 8px; line-height: 1.65; }
html[data-ui-shell="immersive"] .rad-build p:last-child { margin-bottom: 0; }
html[data-ui-shell="immersive"] .rad-panel-row { gap: 18px; align-items: flex-start; }
html[data-ui-shell="immersive"] .rad-panel-body { min-width: 0; }
html[data-ui-shell="immersive"] .rad-panel-body p { margin: 0 0 8px; line-height: 1.6; }
html[data-ui-shell="immersive"] .rad-panel-body p:last-child { margin-bottom: 0; }

/* "Commonly used" note under the example sentence. */
html[data-ui-shell="immersive"] .sentence-usage {
  margin: 16px 0 0;
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.6;
  text-align: left;
}
html[data-ui-shell="immersive"] .sentence-card > p { overflow-wrap: anywhere; }

/* Vocabulary rows and radical example rows: padded, spaced, vertically centred. */
html[data-ui-shell="immersive"] .vocab-table { gap: 10px; }
html[data-ui-shell="immersive"] .vocab-row {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1.8fr);
  align-items: center;
  padding: 14px 18px;
}
html[data-ui-shell="immersive"] .vocab-reading { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
html[data-ui-shell="immersive"] .vocab-section .rad-ex {
  padding: 14px 18px;
  margin: 0 0 10px;
  gap: 16px;
  border-bottom: 1px solid var(--liquid-trim);
}
html[data-ui-shell="immersive"] .vocab-section .rad-ex:last-child { margin-bottom: 0; }
html[data-ui-shell="immersive"] .rad-ex-body { min-width: 0; }
html[data-ui-shell="immersive"] .rad-ex-parts { line-height: 1.8; }
html[data-ui-shell="immersive"] .rad-ex-parts span { padding: 2px 8px; }
html[data-ui-shell="immersive"] .rad-ex-read { row-gap: 4px; line-height: 1.55; }
@media (max-width: 700px) {
  html[data-ui-shell="immersive"] .vocab-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    row-gap: 8px;
    padding: 14px 16px;
  }
  html[data-ui-shell="immersive"] .rad-read-list { padding: 14px 14px 14px 34px !important; }
  html[data-ui-shell="immersive"] .vocab-section .rad-ex { padding: 12px 14px; }
}


/* =====================================================================
   Build 65 — test / practice / timed-test result screens
   Final answers, notes and score tiles are aligned inside their boxes.
   ===================================================================== */
/* Centered result panels: their notes are centred too (the note has a
   52ch max-width, which used to leave it hugging the left of the card). */
html[data-ui-shell="immersive"] :is(
  #exam-panel-results, #mcq-panel-results, #mock-results, #placement-done, #panel-done
) { text-align: center; }
html[data-ui-shell="immersive"] :is(
  #exam-panel-results, #mcq-panel-results, #mock-results, #placement-done, #panel-done
) .practice-note {
  max-width: min(52ch, 100%);
  margin-inline: auto;
  text-align: center;
  line-height: 1.6;
}
/* ...but the review cards themselves read left-to-right and stay left aligned. */
html[data-ui-shell="immersive"] :is(.exam-review-card, .mcq-review-row, .mock-review > *) { text-align: left; }
html[data-ui-shell="immersive"] .exam-review-card { padding: 16px 18px; }
html[data-ui-shell="immersive"] .exam-review-card > * { max-width: 100%; overflow-wrap: anywhere; }
html[data-ui-shell="immersive"] .exam-review-card > p { margin: 8px 0; line-height: 1.6; }

/* Placement result: clear gaps between recommendation, note and button. */
html[data-ui-shell="immersive"] #placement-done > * { margin-left: auto; margin-right: auto; }
html[data-ui-shell="immersive"] #placement-done #placement-recommendation { margin-top: 14px; line-height: 1.35; }
html[data-ui-shell="immersive"] #placement-done #placement-note {
  margin-top: 12px;
  max-width: 46ch;
  line-height: 1.65;
}
html[data-ui-shell="immersive"] #placement-done #placement-go {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  margin-top: 22px;
  margin-bottom: 4px;
}

/* Mock score tiles: an odd last tile spans the row instead of dangling. */
html[data-ui-shell="immersive"] .mock-breakdown > div { text-align: center; }
@media (max-width: 700px) {
  html[data-ui-shell="immersive"] .mock-breakdown > div:last-child:nth-child(odd) { grid-column: 1 / -1; }
}


/* =====================================================================
   Build 66 — search fields on Grammar, Radicals, Write and Japan Explorer
   The mic now lives inside the same glass field as the text (it used to be
   pinned to the far edge of the page, hundreds of pixels from the input).
   ===================================================================== */
html[data-ui-shell="immersive"] .japan-search-wrap > .catalog-search-field.voice-field,
html[data-ui-shell="immersive"] .kanji-write-controls > .catalog-search-field.voice-field {
  margin-top: 0;
  width: 100%;
  max-width: 100%;
}
html[data-ui-shell="immersive"] .rad-section > .catalog-search-field.voice-field { margin: 4px 0 18px; }
html[data-ui-shell="immersive"] .page-head + .catalog-search-field.voice-field { margin: 4px 0 18px; }
html[data-ui-shell="immersive"] .page-head + .catalog-search-field.voice-field + .level-options { margin-top: 0; }
html[data-ui-shell="immersive"] .page-head > .catalog-search-field.voice-field { margin: 18px 0 0; }
html[data-ui-shell="immersive"] #grammar-levels {
  justify-content: flex-start;
  margin: 16px 0 0;
  padding: 0;
  gap: 8px;
}
